<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大肥鱼 · 桌面控制台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="avatar-ring">
          <img class="avatar" src="assets/deepseek-chan.png" alt="大肥鱼 Q 版形象" />
        </div>
        <div class="brand-text">
          <h1>大肥鱼</h1>
          <p>QQ 机器人 · 桌面控制台</p>
        </div>
      </div>

      <nav class="nav" aria-label="主导航">
        <button class="nav-item is-active" data-page="overview" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5 12 5l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
          <span>总览</span>
        </button>
        <button class="nav-item" data-page="services" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2"/></svg>
          <span>服务</span>
        </button>
        <button class="nav-item" data-page="embed" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 7h.01M10 7h.01"/></svg>
          <span>服务网页</span>
        </button>
        <button class="nav-item" data-page="setup" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.3 5.7 6.2.5-4.7 4 1.4 6.1-5.2-3.2-5.2 3.2 1.4-6.1-4.7-4 6.2-.5z"/></svg>
          <span>首次设置</span>
        </button>
        <button class="nav-item" data-page="environment" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7"/><path d="m16 15 2 2 3-4"/></svg>
          <span>环境安装</span>
        </button>
        <button class="nav-item" data-page="startup" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>
          <span>启动与恢复</span>
        </button>
        <button class="nav-item" data-page="logs" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>
          <span>运行日志</span>
        </button>
        <button class="nav-item" data-page="env" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7v6c0 4.4 3.4 7.5 8 8 4.6-.5 8-3.6 8-8V7z"/><path d="m9 12 2 2 4-4"/></svg>
          <span>环境检查</span>
        </button>
        <button class="nav-item" data-page="config" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
          <span>配置</span>
        </button>
        <button class="nav-item" data-page="memory" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-2 2.8v2.4A3 3 0 0 0 6 16v1a3 3 0 0 0 3 3h1V4z"/><path d="M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 2 2.8v2.4A3 3 0 0 1 18 16v1a3 3 0 0 1-3 3h-1V4z"/><path d="M9 9h6M9 15h6"/></svg>
          <span>长期记忆</span>
        </button>
        <button class="nav-item" data-page="bilibili" type="button" id="nav-bilibili">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m8 6 2-3M16 6l-2-3M8 12l3 2-3 2M13 16h3"/></svg>
          <span>B站活动</span><span class="nav-badge" id="nav-bili-badge"></span>
        </button>
        <button class="nav-item" data-page="backups" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 7v5c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/><path d="M4 12v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"/></svg>
          <span>数据备份</span>
        </button>
        <button class="nav-item" data-page="about" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
          <span>关于</span>
        </button>
      </nav>

      <div class="side-foot">
        <div class="phase-pill">第三阶段 · 服务控制</div>
        <div class="bubble" id="side-bubble">今天也要好好看着家哦～</div>
        <div class="foot-note">关闭窗口 → 隐藏到托盘；不会停止机器人</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-head">
          <h2 id="page-title">总览</h2>
          <p id="page-subtitle">正在读取运行状态…</p>
        </div>
        <div class="topbar-right">
          <div class="clock" id="clock">--:--:--</div>
          <div class="mode-pill" id="mode-pill" title="服务启动/停止的真实控制开关">控制：关闭</div>
          <button class="icon-btn" id="refresh-btn" type="button" title="重新检测">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
          </button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="wizard-root"></div>
  <div id="guide-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="core/format.js"></script>
  <script src="components/progress.js"></script>
  <script src="components/guide.js"></script>
  <script src="pages/overview.js"></script>
  <script src="pages/setup.js"></script>
  <script src="pages/environment.js"></script>
  <script src="pages/embed.js"></script>
  <script src="pages/services.js"></script>
  <script src="pages/startup.js"></script>
  <script src="pages/logs.js"></script>
  <script src="pages/env.js"></script>
  <script src="pages/config.js"></script>
  <script src="pages/memory.js"></script>
  <script src="pages/bilibili.js"></script>
  <script src="pages/backups.js"></script>
  <script src="pages/about.js"></script>
  <script src="app.js"></script>
</body>
</html>
